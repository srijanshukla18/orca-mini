name: 💡 Feature Request
description: Suggest a focused improvement for Orca Mini
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Orca Mini. Explain the browsing problem and the resource cost of the proposed solution.

  - type: textarea
    id: feature
    attributes:
      label: Describe the Feature
      description: A clear description of what the feature is and what problem it solves.
      placeholder: Explain your feature idea in detail.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe how users (including yourself) would use this feature.
      placeholder: I’d use this to manage pinned tabs more quickly...
    validations:
      required: true

  - type: textarea
    id: complexity
    attributes:
      label: Implementation Complexity & User Impact
      description: Your thoughts on how difficult this might be to implement and who benefits.
      placeholder: Seems easy to add since WebKit already supports X...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any extra context, links, or mockups.
    validations:
      required: false
