name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Apple silicon / macOS 15
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme ora \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build/ci-derived-data \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO | xcbeautify

      - name: Verify Release architecture
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme ora \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath build/ci-derived-data \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO | xcbeautify
          test "$(lipo -archs "build/ci-derived-data/Build/Products/Release/Orca Mini.app/Contents/MacOS/Orca Mini")" = arm64
