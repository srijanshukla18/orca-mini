name: Ora
options:
  bundleIdPrefix: com.orabrowser

packages:
  FaviconFinder:
    url: https://github.com/will-lumley/FavIconFinder
    exactVersion: 5.1.5
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib
    exactVersion: 4.2.2
  # Pin transitive runtime packages so generated projects resolve reproducibly.
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.9
  SwiftPSL:
    url: https://github.com/ameshkov/swift-psl
    exactVersion: 1.1.164

targets:
  ora:
    type: application
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: ora
        excludes:
          - "Assets/Icons/**"
    resources:
      - path: ora/Resources
        optional: true
    dependencies:
      - package: FaviconFinder
      - package: SafariConverterLib
        product: ContentBlockerConverter

    preBuildScripts:
      - name: "Copy Icon Bundle"
        inputFiles:
          - "$(SRCROOT)/ora/Assets/Icons/OraIcon.icon"
          - "$(SRCROOT)/ora/Assets/Icons/OraIconDev.icon"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/OraIcon.icon"
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/OraIconDev.icon"
        script: |
          ICON_SRC_DEV="$SRCROOT/ora/Assets/Icons/OraIconDev.icon"
          ICON_SRC_RELEASE="$SRCROOT/ora/Assets/Icons/OraIcon.icon"
          ICON_DST="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/"
          if [ "$CONFIGURATION" = "Debug" ]; then
              echo "Using OraIconDev.icon for Debug build"
              cp -R "$ICON_SRC_DEV" "$ICON_DST"
          else
              echo "Using OraIcon.icon for Release build"
              cp -R "$ICON_SRC_RELEASE" "$ICON_DST"
          fi

      - name: "Copy Legal Notices"
        inputFiles:
          - "$(SRCROOT)/LICENSE"
          - "$(SRCROOT)/THIRD_PARTY_NOTICES.md"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/LICENSE"
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/THIRD_PARTY_NOTICES.md"
        script: |
          LEGAL_DST="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/"
          mkdir -p "$LEGAL_DST"
          cp "$SRCROOT/LICENSE" "$LEGAL_DST/LICENSE"
          cp "$SRCROOT/THIRD_PARTY_NOTICES.md" "$LEGAL_DST/THIRD_PARTY_NOTICES.md"

    info:
      path: ora/Info/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Orca Mini
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            CFBundleURLSchemes:
              - http
              - https
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web URL
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.url
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.html
          - CFBundleTypeName: XHTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.xhtml
        NSUserActivityTypes:
          - NSUserActivityTypeBrowsingWeb
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.web-browser

    entitlements:
      path: ora/Info/ora.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.assets.movies.read-only: true
        com.apple.security.assets.music.read-only: true
        com.apple.security.assets.pictures.read-only: true
        com.apple.security.cs.allow-jit: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.print: true
        com.apple.developer.web-browser: true
        com.apple.developer.web-browser.public-key-credential: true

    settings:
      base:
        ARCHS: arm64
        SWIFT_VERSION: 5.9
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.2.15
        CURRENT_PROJECT_VERSION: 106
        PRODUCT_NAME: "Orca Mini"
        PRODUCT_MODULE_NAME: Ora
        PRODUCT_BUNDLE_IDENTIFIER: com.orabrowser.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: OraIconDev
          CODE_SIGN_ENTITLEMENTS: ora/Info/ora.entitlements
          CODE_SIGN_STYLE: Automatic
          EMIT_FRONTEND_COMMAND_LINES: YES
          OTHER_LDFLAGS: "-Xlinker -interposable"
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: OraIcon
          CODE_SIGN_ENTITLEMENTS: ora/Info/ora.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES

  oraTests:
    type: bundle.unit-test
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: oraTests
    dependencies:
      - target: ora
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Orca Mini.app/Contents/MacOS/Orca Mini"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ora:
    shared: true
    build:
      targets:
        ora: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - oraTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
